name: Vietnamese ASR checks
on:
  push:
    paths:
      - 'Vietnamese-ASR-Analyzer/**'
      - '.github/workflows/asr-check.yml'
  pull_request:
    paths:
      - 'Vietnamese-ASR-Analyzer/**'
      - '.github/workflows/asr-check.yml'
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Vietnamese-ASR-Analyzer/requirements-dev.txt
      - run: python -m pytest Vietnamese-ASR-Analyzer/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Vietnamese-ASR-Analyzer/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Vietnamese-ASR-Analyzer/web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
