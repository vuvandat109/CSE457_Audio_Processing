# Wav2Vec2-only Render Free trial. Does not affect other Render services.
# 512 MB RAM may still be insufficient for full PyTorch inference.
services:
  - type: web
    name: vietnamese-asr-wav2vec2
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Vietnamese-ASR-Analyzer/Dockerfile
    dockerContext: ./Vietnamese-ASR-Analyzer
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: USE_TF
        value: "0"
      - key: USE_FLAX
        value: "0"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
